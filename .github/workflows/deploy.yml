# Check, then deploy. Every push to main first runs `npm run check` (type check, unit, architecture and
# server tests, protected files, browser walkthrough). Only if it passes is the site built and deployed
# to Cloudflare, and a smoke test then asks the live address whether it is the real thing. A failing
# change never reaches the live site. Locally, `npm run ship` and the pre-push hook run the same check.
# This workflow is the only deployer. It can also be run by hand (Actions > Check and deploy > Run workflow),
# for example after replacing the admin password or the authenticator key.
name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a running deploy is never cut off midway; a newer one waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_ORIGIN: https://noha-pearls.miss-noha-farid.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm run check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No valid secrets, no deploy: a site must never go out with a weak, public or missing password or key.
      - name: Prepare the Worker's secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOTP_SECRET: ${{ secrets.ADMIN_TOTP_SECRET }}
        run: node scripts/worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c dist/noha_pearls/wrangler.json --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Delete the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Smoke test the live site
        run: node scripts/smoke.mjs "$SITE_ORIGIN"
