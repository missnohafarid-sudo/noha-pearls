# The old GitHub Pages site was a browser-only prototype whose files carried the admin password's hash and
# the authenticator key. A workflow cannot unpublish a Pages site, so its last deployment is replaced by a
# page that sends visitors to the new address. This runs once when it lands, and by hand if needed.
# Delete this file and `.github/pages-forward/` once Pages is switched off in the repository settings.
name: Retire the Pages site

on:
  push:
    branches: [main]
    paths:
      - .github/pages-forward/**
      - .github/workflows/retire-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-forward
      - id: deployment
        uses: actions/deploy-pages@v4
